{% extends "base.html" %}
{% block content %}
<p class=".h2 text-center "><kbd>Hello, {{ current_user.full_name }}!</kbd></p>

<h2>Available Treks</h2>

{% for trek in treks %}
<div class="card mb-3">
    <div class="card-body">
        <h5 class="card-title">{{ trek.trek_name }}</h5>
        <p class="card-text">Location: {{ trek.location }}</p>
        <p class="card-text">Difficulty: {{ trek.difficulty }}</p>
        <p class="card-text">Available Slots: {{ trek.available_slots }}</p>
        <a href="{{ url_for('user.book_trek', trek_id=trek.trek_id) }}" class="btn btn-primary">Book</a>
    </div>
</div>
{% endfor %}

{% endblock %}
