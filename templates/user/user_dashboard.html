{% extends "base.html" %}
{% block content %}
<p class=".h2 text-center "><kbd>Hello, {{ current_user.full_name }}!</kbd></p>

<h2>Available Treks</h2>
<div class="card mb-4">
    <div class="card-body">
        <form method="POST" action="{{ url_for('user.search_treks') }}">
            <div class="row">
                <div class="col-md-5">
                    <input type="text" name="trek_name" class="form-control" placeholder="Search Trek">
                </div>
                <div class="col-md-4">
                    <select name="difficulty" class="form-select">
                        <option value="">
                            Difficulty
                        </option>
                        <option value="Easy">
                            Easy
                        </option>
                        <option value="Moderate">
                            Moderate
                        </option>
                        <option value="Hard">
                            Hard
                        </option>
                    </select>
                </div>
                <div class="col-md-3">
                    <button class="btn btn-primary w-100">
                        Search
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>


<br> <br>
{% for trek in treks %}
<div class="card mb-3">
    <div class="card-body">
        <h5 class="card-title">{{ trek.trek_name }}</h5>
        <p class="card-text">Location: {{ trek.location }}</p>
        <p class="card-text"><span class="badge bg-secondary">{{ trek.difficulty }}</span></p>
        <p class="card-text">Available Slots: {{ trek.available_slots }}</p>
        <a href="{{ url_for('user.book_trek', trek_id=trek.trek_id) }}" class="btn btn-primary">Book</a>
    </div>
</div>
{% endfor %}

{% endblock %}
