{% extends "base.html" %}

{% block content %}

<h2>Users</h2>

<table class="table table-bordered">

    <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Name</th>
        <th>Email</th>
        <th>Action</th>
    </tr>

    {% for user in users %}

    <tr>

        <td>{{ user.user_id }}</td>
        <td>{{ user.username }}</td>
        <td>{{ user.full_name }}</td>
        <td>{{ user.email }}</td>

        <td>

            <a href="{{ url_for('admin.blacklist_user', user_id=user.user_id) }}" class="btn btn-danger btn-sm">

                Blacklist

            </a>

        </td>

    </tr>

    {% endfor %}

</table>

{% endblock %}
