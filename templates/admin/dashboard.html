{% extends "base.html" %}

{% block content %}

<h2>Admin Dashboard</h2>

<div class="row">

    <div class="col-md-3">
        <div class="card stat-card">
            <div class="card-body">
                <h5>Total Treks</h5>
                <h2 class="text-primary">{{ total_treks }}</h2>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card stat-card">
            <div class="card-body">
                <h5>Total Users</h5>
                <h2 class="text-success">{{ total_users }}</h2>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card stat-card">
            <div class="card-body">
                <h5>Total Staff</h5>
                <h2 class="text-warning">{{ total_trek_staff }}</h2>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card stat-card">
            <div class="card-body">
                <h5>Total Bookings</h5>
                <h2 class="text-danger">{{ total_bookings }}</h2>
            </div>
        </div>
    </div>

</div>

{% endblock %}
